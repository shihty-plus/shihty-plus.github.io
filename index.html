<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#04201F">
  <title>SHIHTY+ — دراسة وطنية حول الإنترنت وصحة الطلبة</title>
  <link rel="icon" href="assets/logo-shihty.svg?v=2" type="image/svg+xml">
  <link rel="icon" href="assets/logo-shihty-32.png?v=2" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/logo-shihty-180.png?v=2">
  <link rel="preload" href="assets/fonts/tajawal-arabic-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    /* mise à jour : si une version plus récente est en ligne, on recharge la page (contourne le cache) */
    window.SHIHTY_VERSION = '38';
    (function () {
      try {
        fetch('version.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
          if (!j || !j.v || j.v === window.SHIHTY_VERSION) return;
          var u = new URL(location.href);
          if (u.searchParams.get('maj') === j.v) return;
          u.searchParams.set('maj', j.v); location.replace(u.toString());
        }).catch(function () {});
      } catch (e) { /* rien */ }
    })();
  </script>
  <link rel="stylesheet" href="css/style.css?v=38">
</head>
<body>
  <div class="decor" aria-hidden="true"><span class="d1"></span><span class="d2"></span><span class="d3"></span><span class="d4"></span></div>
  <div id="bandeau" class="bandeau" hidden></div>

  <header class="entete">
    <div class="entete-int">
      <a class="marque" href="./" aria-label="SHIHTY+">
        <span class="marque-icone" aria-hidden="true"><svg viewBox="0 0 40 40" width="34" height="34" aria-hidden="true"><rect x="8" y="8" width="24" height="24" rx="3" fill="#0D9488"/><rect x="8" y="8" width="24" height="24" rx="3" fill="#0D9488" transform="rotate(45 20 20)"/><rect x="11.500" y="11.500" width="17" height="17" rx="2" fill="none" stroke="#FBF8F3" stroke-width="1.300"/><rect x="11.500" y="11.500" width="17" height="17" rx="2" fill="none" stroke="#FBF8F3" stroke-width="1.300" transform="rotate(45 20 20)"/><path d="M20 13.500v13M13.500 20h13" stroke="#FF7F6B" stroke-width="4" stroke-linecap="round"/></svg></span>
        <span id="marque-nom" class="marque-nom">SHIHTY<b class="plus" aria-hidden="true">+</b></span>
      </a>
      <div class="entete-droite">
        <button type="button" id="btn-jeux" class="album-btn" hidden><span class="album-icone" aria-hidden="true">☕</span><span id="jeux-bouton-texte" class="album-bouton-texte">استراحة</span></button>
        <button type="button" id="btn-carte" class="album-btn" hidden><span class="album-icone" aria-hidden="true">🗺️</span><span id="carte-bouton-texte" class="album-bouton-texte">خريطتي</span></button>
        <button type="button" id="album" class="album-btn" hidden><span class="album-icone" aria-hidden="true">🎖️</span><span id="album-bouton-texte" class="album-bouton-texte">ألبومي</span><span id="album-compte" class="album-compte" dir="ltr">0 / 20</span></button>
        <span id="salutation" class="salutation" hidden></span>
      </div>
    </div>
  </header>

  <main id="app" class="page" tabindex="-1">
    <p class="chargement">...</p>
    <noscript><p class="carte">المرجو تفعيل JavaScript في متصفحك للمشاركة في الاستبيان.</p></noscript>
  </main>

  <footer class="pied">
    <button type="button" id="lien-aide" class="lien-aide"></button>
  </footer>

  <dialog id="dialogue-aide" class="dialogue" aria-labelledby="aide-titre"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

</body>
